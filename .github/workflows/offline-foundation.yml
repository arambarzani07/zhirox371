name: Offline foundation checks
on:
  pull_request:
    paths:
      - 'offline/**'
      - 'docs/full-offline-foundation-v1.md'
      - '.github/workflows/offline-foundation.yml'
  push:
    branches: [main, 'feature/full-offline-foundation-v1', 'feature/offline-local-auth-v3']
    paths:
      - 'offline/**'
      - 'docs/full-offline-foundation-v1.md'
      - '.github/workflows/offline-foundation.yml'
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # React root has no npm test script; run the isolated local API tests directly.
      - run: node --test offline/tests/*.test.mjs
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zhirox_local_test
          POSTGRES_USER: localtest
          POSTGRES_PASSWORD: localtest_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localtest -d zhirox_local_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: localtest
      PGPASSWORD: localtest_password
      PGDATABASE: zhirox_local_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Apply migrations in disposable database
        run: |
          psql -v ON_ERROR_STOP=1 -f offline/migrations/001_core.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/002_atomic_checkout.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/003_local_users.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/004_catalog_indexes.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/005_price_locked_checkout.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/006_packs_scale_checkout.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/007_outbox_leases.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/009_durable_checkout_intents.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/011_immutable_receipts_v34.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/012_print_queue_v35.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/007_receiver_fixture.sql
          psql -v ON_ERROR_STOP=1 -f offline/cloud-migrations/008_v28_received_sales.sql
      - name: Test checkout rollback, idempotency and stock
        run: |
          psql -v ON_ERROR_STOP=1 -f offline/tests/001_checkout_smoke.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/005_price_locked_checkout.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/006_packs_scale_checkout.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/007_outbox_leases.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/009_durable_checkout.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/011_immutable_receipts_v34.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/012_print_queue_v35.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/008_cloud_inbox.sql
      - name: Concurrent local PostgreSQL cashiers must not oversell last unit
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f offline/tests/010_v33_concurrency_seed.sql
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          psql -v ON_ERROR_STOP=1 -c "SELECT * FROM zhirox_local.commit_checkout_v31('10000000-0000-0000-0000-000000000033','30000000-0000-0000-0000-000000000033','40000000-0000-0000-0000-000000000033')" > "$tmp/a.log" 2>&1 &
          a=$!
          psql -v ON_ERROR_STOP=1 -c "SELECT * FROM zhirox_local.commit_checkout_v31('10000000-0000-0000-0000-000000000033','30000000-0000-0000-0000-000000000034','40000000-0000-0000-0000-000000000034')" > "$tmp/b.log" 2>&1 &
          b=$!
          set +e
          wait "$a"; sa=$?
          wait "$b"; sb=$?
          set -e
          if ! { { [ "$sa" -eq 0 ] && [ "$sb" -ne 0 ]; } || { [ "$sb" -eq 0 ] && [ "$sa" -ne 0 ]; }; }; then
            echo "V33 concurrency failure: exactly one last-unit checkout must succeed"
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -f offline/tests/010_v33_concurrency_verify.sql
      - name: Full local PostgreSQL custom-format backup and restore to separate disposable database
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          pg_dump -Fc --schema=zhirox_local --file="$tmp/local-custom.dump"
          test -s "$tmp/local-custom.dump"
          pg_restore --list "$tmp/local-custom.dump" > "$tmp/contents.txt"
          grep -q 'TABLE DATA.*sales' "$tmp/contents.txt"
          createdb zhirox_v33_restored_test
          pg_restore --exit-on-error --no-owner --no-acl --dbname=zhirox_v33_restored_test "$tmp/local-custom.dump"
          source_state=$(psql -At -c "SELECT (SELECT count(*) FROM zhirox_local.sales WHERE store_id='10000000-0000-0000-0000-000000000033'),(SELECT stock_base_units FROM zhirox_local.products WHERE store_id='10000000-0000-0000-0000-000000000033' AND id='20000000-0000-0000-0000-000000000033'),(SELECT count(*) FROM zhirox_local.event_outbox WHERE store_id='10000000-0000-0000-0000-000000000033'),(SELECT count(*) FROM zhirox_local.checkout_intents_v31 WHERE store_id='10000000-0000-0000-0000-000000000033')")
          restored_state=$(PGDATABASE=zhirox_v33_restored_test psql -At -c "SELECT (SELECT count(*) FROM zhirox_local.sales WHERE store_id='10000000-0000-0000-0000-000000000033'),(SELECT stock_base_units FROM zhirox_local.products WHERE store_id='10000000-0000-0000-0000-000000000033' AND id='20000000-0000-0000-0000-000000000033'),(SELECT count(*) FROM zhirox_local.event_outbox WHERE store_id='10000000-0000-0000-0000-000000000033'),(SELECT count(*) FROM zhirox_local.checkout_intents_v31 WHERE store_id='10000000-0000-0000-0000-000000000033')")
          test "$source_state" = "$restored_state"
          test "$restored_state" = "1|0|1|2"
          PGDATABASE=zhirox_v33_restored_test psql -v ON_ERROR_STOP=1 -f offline/tests/010_v33_concurrency_verify.sql
          echo "V33 PASS: full custom-format backup restored into isolated PostgreSQL with matching receipts, stock, events and pending intents"

      - name: V37 isolated shift checkout acceptance (after legacy V33 restore drill)
        run: |
          psql -v ON_ERROR_STOP=1 -f offline/migrations/013_cash_shifts_v37.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/013_cash_shifts_v37.sql
      - name: V38 immutable cash journal, overdraw and reconciled close
        run: |
          psql -v ON_ERROR_STOP=1 -f offline/migrations/014_cash_movements_v38.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/014_cash_movements_v38.sql
      - name: V39 manager-approved cash refunds, restock and refund-aware closing
        run: |
          psql -v ON_ERROR_STOP=1 -f offline/migrations/015_manager_cash_refunds_v39.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/015_manager_cash_refunds_v39.sql
