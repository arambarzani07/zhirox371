name: V23 React preview safety
on:
  pull_request:
    paths:
      - 'config.js'
      - 'src/**'
      - 'tests/v23_preview_mode_guard.test.mjs'
      - 'tests/browser/v23_react_preview.mjs'
      - 'tests/browser/v24_react_local_pilot.mjs'
      - 'tests/browser/v29_owner_mobile.mjs'
      - 'tests/browser/v30_owner_https.mjs'
      - 'offline/secure-owner-v30.mjs'
      - 'offline/tests/secure-owner-v30.test.mjs'
      - 'offline/owner-v29*'
      - 'offline/cloud-receiver-v29.mjs'
      - 'tests/v24_local_pilot_contract.test.mjs'
      - 'vite.config.ts'
      - 'docs/V24_LOCAL_POSTGRES_REACT_PILOT.md'
      - 'docs/V23_RELEASE_SAFETY_GATE.md'
      - '.github/workflows/v23-react-preview-safety.yml'
  push:
    branches: [main]
    paths:
      - 'config.js'
      - 'src/**'
      - 'tests/v23_preview_mode_guard.test.mjs'
      - '.github/workflows/v23-react-preview-safety.yml'
permissions:
  contents: read
jobs:
  preview-safety-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail-closed offline mock and DEMO-only receipt checks
        run: node --test tests/v23_preview_mode_guard.test.mjs
      - name: Verify V24 loopback auth, idempotency and cashier isolation
        run: node --test tests/v24_local_pilot_contract.test.mjs
      - name: Install React preview dependencies (no deploy or database)
        run: npm install --no-package-lock
      - name: Typecheck and build the React PC preview
        run: npm run build
      - name: Install pinned Chromium for actual React UI regression
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve local React preview (test only)
        run: |
          (VITE_ENABLE_LOCAL_PILOT=true npm run dev -- --host 127.0.0.1 > /tmp/v23-vite.log 2>&1 &)
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v23-vite.log
          exit 1
      - name: Verify Home, offline demo barcode and printable DEMO-RCP in Chromium
        run: node tests/browser/v23_react_preview.mjs
      - name: Verify isolated V24 authenticated local checkout with same-request retry
        run: node tests/browser/v24_react_local_pilot.mjs
      - name: Verify 390px Sorani RTL iPhone owner preview and bearer-only access
        run: node tests/browser/v29_owner_mobile.mjs
      - name: Verify V30 TLS-protected iPhone owner preview and immediate token revocation
        run: node tests/browser/v30_owner_https.mjs
