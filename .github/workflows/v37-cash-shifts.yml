name: V37 isolated local cash shift verification
on:
  pull_request:
    paths:
      - 'offline/local-shifts-v37.mjs'
      - 'offline/local-durable-server-v31.mjs'
      - 'offline/migrations/013_cash_shifts_v37.sql'
      - 'offline/tests/*shifts*v37*'
      - 'src/components/LocalV37ShiftControls.tsx'
      - 'src/components/LocalPostgresPilotV24.tsx'
      - 'tests/browser/v37_local_cash_shifts.mjs'
      - '.github/workflows/v37-cash-shifts.yml'
  push:
    branches: [main]
    paths:
      - 'offline/local-shifts-v37.mjs'
      - 'offline/migrations/013_cash_shifts_v37.sql'
      - 'src/components/LocalV37ShiftControls.tsx'
      - '.github/workflows/v37-cash-shifts.yml'
permissions:
  contents: read
jobs:
  local-shift-ui-and-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Signed local shift API authorization and validation
        run: node --test offline/tests/local-shifts-v37.test.mjs
      - name: Install React test dependencies
        run: npm install --no-package-lock
      - name: Build V37 isolated pilot without Demo provider
        run: |
          VITE_V36_ISOLATED_LAN_PILOT=true VITE_V37_LOCAL_SHIFTS=true npm run build
          node scripts/package-lan-pilot-v36.mjs dist
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Preview isolated pilot on loopback only
        shell: bash
        run: |
          (npm run preview -- --host 127.0.0.1 --port 3042 >/tmp/v37-react.log 2>&1 &)
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3042/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v37-react.log
          exit 1
      - name: Confirm shift-gated checkout, no Demo path and close reconciliation UI
        run: node tests/browser/v37_local_cash_shifts.mjs
      - name: Explicit official bundle must still be blocked
        shell: bash
        run: |
          if VITE_ZHIROX_RELEASE_MODE=official npm run build; then
            echo "::error::Uncertified cashier must not build official"
            exit 1
          fi
