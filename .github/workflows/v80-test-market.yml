name: V80 isolated test market persisted account and real SQL actions
on:
  pull_request:
    paths:
      - 'offline/test-market-v80.mjs'
      - 'offline/test-market-reset-passwords-v80.mjs'
      - 'offline/tests/test-market-v80.test.mjs'
      - 'offline/tests/036_v80_test_market_persisted.sql'
      - 'offline/tests/verify-test-market-login-v80.mjs'
      - '.github/workflows/v80-test-market.yml'
      - 'docs/V80_TEST_MARKET.md'
  push:
    branches: [main]
    paths:
      - 'offline/test-market-v80.mjs'
      - 'offline/test-market-reset-passwords-v80.mjs'
      - 'offline/tests/test-market-v80.test.mjs'
      - 'offline/tests/036_v80_test_market_persisted.sql'
      - 'offline/tests/verify-test-market-login-v80.mjs'
      - '.github/workflows/v80-test-market.yml'
      - 'docs/V80_TEST_MARKET.md'
permissions:
  contents: read
jobs:
  real-postgresql-test-market:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zhirox_v80_disposable
          POSTGRES_USER: v80test
          POSTGRES_PASSWORD: isolated_v80_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v80test -d zhirox_v80_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: v80test
      PGPASSWORD: isolated_v80_ci_only
      PGDATABASE: zhirox_v80_disposable
      ZHIROX_LOCAL_DB_URL: postgresql://v80test:isolated_v80_ci_only@127.0.0.1:5432/zhirox_v80_disposable
      ZHIROX_V80_CREATE_MARKET: YES_CREATE_TEST_MARKET
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test store creation guard and non-deletion contract
        run: node --test offline/tests/test-market-v80.test.mjs
      - name: Install PostgreSQL client and temporary node postgres driver
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          npm install --no-save --no-package-lock pg
      - name: Generate ephemeral independent account passwords without logging
        shell: bash
        run: |
          echo "ZHIROX_TEST_OWNER_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "ZHIROX_TEST_CASHIER_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Guard database scope and install foundational schema
        shell: bash
        run: |
          set -euo pipefail
          test "$PGDATABASE" = "zhirox_v80_disposable"
          test "$PGHOST" = "127.0.0.1"
          psql -v ON_ERROR_STOP=1 -f offline/migrations/001_core.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/002_atomic_checkout.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/003_local_users.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/028_customer_debt_ledger_v79.sql
      - name: Create REAL isolated store account, products, two cashier sales and debt actions
        run: node offline/test-market-v80.mjs
      - name: Verify authentication of both PostgreSQL-backed test accounts
        run: node offline/tests/verify-test-market-login-v80.mjs
      - name: Verify committed sales receipts stock journal and debt ledger
        run: psql -v ON_ERROR_STOP=1 -f offline/tests/036_v80_test_market_persisted.sql
      - name: Persist a RESTORABLE PostgreSQL custom-format backup (not a running store)
        run: |
          mkdir -p artifacts
          umask 077
          pg_dump -Fc --schema=zhirox_local -f artifacts/ZHIROX-V80-TEST-MARKET.dump
          test -s artifacts/ZHIROX-V80-TEST-MARKET.dump
          pg_restore --list artifacts/ZHIROX-V80-TEST-MARKET.dump | grep 'TABLE DATA.*sales '
          pg_restore --list artifacts/ZHIROX-V80-TEST-MARKET.dump | grep 'TABLE DATA.*customers_v79 '
          printf 'Real PostgreSQL snapshot, test-only and not live deployment. Account passwords are ephemeral: reset after restoring in an isolated lab. Never restore to production.\n' > artifacts/READ-ME-FIRST.txt
      - name: Save real test-market snapshot for later restore, not deletion
        uses: actions/upload-artifact@v4
        with:
          name: ZHIROX-V80-TEST-MARKET-POSTGRESQL-DUMP
          path: artifacts/
          retention-days: 30
