permissions:
  contents: read
jobs:
  real-postgres-pc:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zhirox_v80_disposable
          POSTGRES_USER: v80test
          POSTGRES_PASSWORD: disposable_v81_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v80test -d zhirox_v80_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: v80test
      PGPASSWORD: disposable_v81_ci_only
      PGDATABASE: zhirox_v80_disposable
      ZHIROX_LOCAL_DB_URL: postgresql://v80test:disposable_v81_ci_only@127.0.0.1:5432/zhirox_v80_disposable
      ZHIROX_V80_CREATE_MARKET: YES_CREATE_TEST_MARKET
      ZHIROX_V81_TEST_MARKET: YES_LOCAL_TEST_READ_ONLY
      VITE_ENABLE_LOCAL_PILOT: 'true'
      VITE_V81_TEST_MARKET: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check authenticated read-only V81 API security
        run: node --test offline/tests/test-market-v81-api.test.mjs offline/tests/test-market-sections-v82.test.mjs offline/tests/supplier-v83-contract.test.mjs offline/tests/returns-v84-contract.test.mjs offline/tests/cashbook-v85-contract.test.mjs offline/tests/expiry-v86-contract.test.mjs offline/tests/fefo-v87-contract.test.mjs offline/tests/lot-cutover-v88-contract.test.mjs offline/tests/lot-receiving-returns-v89-contract.test.mjs offline/tests/unified-lot-v90-contract.test.mjs offline/tests/v91-concurrency-contract.test.mjs offline/tests/v92-viewer-boundary-contract.test.mjs offline/tests/v93-dual-pool-contract.test.mjs offline/tests/v94-auth-boundary-contract.test.mjs offline/tests/v95-preflight-contract.test.mjs
      - name: Install app, disposable SQL driver and pinned Chromium
        run: |
          npm install --no-save --no-package-lock pg playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Local PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Generate ephemeral credentials without printing
        shell: bash
        run: |
          echo "ZHIROX_TEST_OWNER_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "ZHIROX_TEST_CASHIER_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "ZHIROX_LOCAL_SESSION_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - name: Provision actual isolated PostgreSQL test store and two sales
        shell: bash
        run: |
          set -euo pipefail
          test "$PGDATABASE" = "zhirox_v80_disposable"
          test "$PGHOST" = "127.0.0.1"
          psql -v ON_ERROR_STOP=1 -f offline/migrations/001_core.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/002_atomic_checkout.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/003_local_users.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/028_customer_debt_ledger_v79.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/027_section_settings_v78.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/029_supplier_receiving_v83.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/030_sale_returns_v84.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/031_test_cashbook_v85.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/032_expiry_lots_v86.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/033_fefo_checkout_v87.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/034_lot_cutover_v88.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/035_lot_receiving_returns_v89.sql
          psql -v ON_ERROR_STOP=1 -f offline/migrations/036_unified_lot_ledger_v90.sql
          node offline/test-market-v80.mjs
          node offline/tests/verify-test-market-login-v80.mjs
          psql -v ON_ERROR_STOP=1 -f offline/tests/036_v80_test_market_persisted.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/037_v83_supplier_test_fixture.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/038_v83_supplier_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/039_v84_return_fixture.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/040_v84_returns_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/041_v85_test_cashbook_fixture.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/042_v85_cashbook_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/043_v86_expiry_lot_fixture.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/044_v86_expiry_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/045_v87_fefo_fixture.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/046_v87_fefo_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/047_v88_opening_fixture.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/048_v88_lot_cutover_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/049_v89_lot_receiving_return_fixture.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/050_v89_lot_receiving_returns_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/051_v90_unified_lot_fixture.sql
          psql -v ON_ERROR_STOP=1 -f offline/tests/052_v90_unified_lot_acceptance.sql
      - name: Start loopback-only read-only API on 3311 and Vite PC preview on 3000
        shell: bash
        run: |
          set -euo pipefail
          (node offline/local-test-market-v81.mjs >/tmp/zv81-api.log 2>&1 &)
          for attempt in $(seq 1 35); do
            if curl -s http://127.0.0.1:3311/api/local/v81/overview | grep -q 'invalid_session'; then break; fi
            sleep 1
          done
          curl -sS http://127.0.0.1:3311/api/local/v81/overview | grep -q 'invalid_session'
          (npm run dev -- --host 127.0.0.1 >/tmp/zv81-vite.log 2>&1 &)
          for attempt in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
      - name: Validate real PostgreSQL browser screens, access restrictions and no WAN
        run: node tests/browser/v81_test_market_real_pg.mjs
      - name: Confirm official POS release remains blocked
        shell: bash
        run: |
          if VITE_ZHIROX_RELEASE_MODE=official npm run build; then
            echo "Uncertified official build must remain blocked"
            exit 1
          fi
      - name: V91 concurrent LOT checkout and return acceptance
        run: node offline/tests/v91_unified_lot_concurrency_real_pg.mjs
      - name: V92 create isolated NOLOGIN viewer and lock public SQL function grants
        run: psql -v ON_ERROR_STOP=1 -f offline/migrations/037_v92_isolated_viewer_privilege_boundary.sql
      - name: V92 independent PostgreSQL login and forbidden finance operations
        run: node offline/tests/v92_real_pg_viewer_boundary.mjs
      - name: V93 create isolated inherited NOLOGIN API reader role
        run: psql -v ON_ERROR_STOP=1 -f offline/migrations/038_v93_dual_pool_readonly_api.sql
      - name: V93 real PostgreSQL two-role HTTP sessions and read-only business data
        run: node offline/tests/v93_dual_pool_api_real_pg.mjs
      - name: V94 create isolated low-privilege authentication role
        run: psql -v ON_ERROR_STOP=1 -f offline/migrations/039_v94_restricted_auth_role.sql
      - name: V94 real restricted authentication, denial of financial SQL and signed read-only HTTP
        run: node offline/tests/v94_restricted_auth_real_pg.mjs
      - name: V95 create isolated preflight-only SQL gate and durable decision audit
        run: psql -v ON_ERROR_STOP=1 -f offline/migrations/040_v95_checkout_preflight_audit.sql
      - name: V95 real constrained PostgreSQL preflight allow deny and no checkout
        run: node offline/tests/v95_real_pg_preflight_gate.mjs
      - name: Preserve a restorable REAL PostgreSQL V95 isolated checkout preflight audit test-market snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$PGDATABASE" = "zhirox_v80_disposable"
          mkdir -p artifacts/v95
          umask 077
          pg_dump -Fc --schema=zhirox_local -f artifacts/v95/ZHIROX-V95-TEST-MARKET.dump
          test -s artifacts/v95/ZHIROX-V95-TEST-MARKET.dump
          printf 'V95 test-only restricted actor checkout intent decisions and durable audit, after V94 restricted auth and synthetic V91/V92/V93 transactions with synthetic business values; not physical cashier acceptance. Do not restore to production. Reset ephemeral login passwords after restoring. CI artifact retention is limited. No deletion authorized.\n' > artifacts/v95/README.txt
      - name: Save the current isolated sale returns, purchasing and inventory test archive
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ZHIROX-V95-PREFLIGHT-AUDIT-POSTGRESQL-SNAPSHOT
          path: artifacts/v95/
          retention-days: 30
      - name: Save unaltered Chromium screenshots of actual V81 PC
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZHIROX-V81-REAL-POSTGRESQL-PC-SCREENS
          path: artifacts/v81/
          if-no-files-found: ignore
