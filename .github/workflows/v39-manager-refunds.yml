name: V39 manager-approved full-line cash refunds
on:
  pull_request:
    paths:
      - 'offline/local-refunds-v39.mjs'
      - 'offline/local-durable-server-v31.mjs'
      - 'offline/migrations/015_manager_cash_refunds_v39.sql'
      - 'offline/tests/*shifts*v37*'
      - 'src/components/LocalV39RefundPanel.tsx'
      - 'src/components/LocalPostgresPilotV24.tsx'
      - 'tests/browser/v39_manager_refunds.mjs'
      - '.github/workflows/v39-manager-refunds.yml'
  push:
    branches: [main]
    paths:
      - 'offline/local-refunds-v39.mjs'
      - 'offline/migrations/015_manager_cash_refunds_v39.sql'
      - 'src/components/LocalV39RefundPanel.tsx'
      - '.github/workflows/v39-manager-refunds.yml'
permissions:
  contents: read
jobs:
  cash-refund-dual-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Signed local shift API authorization and validation
        run: node --test offline/tests/local-refunds-v39.test.mjs
      - name: Install React test dependencies
        run: npm install --no-package-lock
      - name: Build V38 isolated pilot without Demo provider
        run: |
          VITE_V36_ISOLATED_LAN_PILOT=true VITE_V37_LOCAL_SHIFTS=true VITE_V38_CASH_LEDGER=true VITE_V39_REFUNDS=true npm run build
          node scripts/package-lan-pilot-v36.mjs dist
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Preview isolated pilot on loopback only
        shell: bash
        run: |
          (npm run preview -- --host 127.0.0.1 --port 3044 >/tmp/v39-react.log 2>&1 &)
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3044/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v39-react.log
          exit 1
      - name: Confirm dual manager approval, full-line return, no Demo cash and correct closing
        run: node tests/browser/v39_manager_refunds.mjs
      - name: Explicit official bundle must still be blocked
        shell: bash
        run: |
          if VITE_ZHIROX_RELEASE_MODE=official npm run build; then
            echo "::error::Uncertified cashier must not build official"
            exit 1
          fi
