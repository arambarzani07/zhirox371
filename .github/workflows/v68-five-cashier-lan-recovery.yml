      - 'offline/tests/v66_postgres_recovery_lab.mjs'
      - 'offline/tests/v67_twin_wan_reconnect_sync.mjs'
      - 'offline/tests/v68_five_cashiers_lan_recovery.mjs'
      - 'offline/tests/v70_docker_cashier_soak_client.mjs'
      - 'offline/tests/v71_postgres_sigkill_printer_fence.mjs'
      - 'offline/tests/v72_telemetry_periodic_backup_restore.mjs'
      - 'offline/tests/v70_five_pc_load_final_audit.mjs'
      - 'offline/tests/033_v70_five_pc_soak_fixture_ci.sql'
      - 'offline/tests/v69_docker_internal_lan_acceptance.sh'
      - 'offline/cloud-migrations/008_v28_received_sales.sql'
      - 'offline/outbox-sync-worker-v27.mjs'
