name: V38 local cash journal and reconciliation
on:
  pull_request:
    paths:
      - 'offline/local-cash-ledger-v38.mjs'
      - 'offline/local-durable-server-v31.mjs'
      - 'offline/migrations/014_cash_movements_v38.sql'
      - 'offline/tests/*shifts*v37*'
      - 'src/components/LocalV38CashMovements.tsx'
      - 'src/components/LocalPostgresPilotV24.tsx'
      - 'tests/browser/v38_cash_movements.mjs'
      - '.github/workflows/v38-cash-ledger.yml'
  push:
    branches: [main]
    paths:
      - 'offline/local-cash-ledger-v38.mjs'
      - 'offline/migrations/014_cash_movements_v38.sql'
      - 'src/components/LocalV38CashMovements.tsx'
      - '.github/workflows/v38-cash-ledger.yml'
permissions:
  contents: read
jobs:
  cash-journal-ui-and-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Signed local shift API authorization and validation
        run: node --test offline/tests/local-cash-ledger-v38.test.mjs
      - name: Install React test dependencies
        run: npm install --no-package-lock
      - name: Build V38 isolated pilot without Demo provider
        run: |
          VITE_V36_ISOLATED_LAN_PILOT=true VITE_V37_LOCAL_SHIFTS=true VITE_V38_CASH_LEDGER=true npm run build
          node scripts/package-lan-pilot-v36.mjs dist
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Preview isolated pilot on loopback only
        shell: bash
        run: |
          (npm run preview -- --host 127.0.0.1 --port 3043 >/tmp/v38-react.log 2>&1 &)
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3043/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v38-react.log
          exit 1
      - name: Confirm cash in, expense and exact server cash reconciliation
        run: node tests/browser/v38_cash_movements.mjs
      - name: Explicit official bundle must still be blocked
        shell: bash
        run: |
          if VITE_ZHIROX_RELEASE_MODE=official npm run build; then
            echo "::error::Uncertified cashier must not build official"
            exit 1
          fi
