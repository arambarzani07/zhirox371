name: Retail OS PC Foundation Checks
on:
  push:
    branches:
      - feature/retail-os-pc-foundation
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch immutable design baseline
        run: git fetch origin +refs/heads/design-lock/pc-home-v1:refs/remotes/origin/design-lock/pc-home-v1
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run foundation, Home-lock and UI safety tests
        run: node --test tests/*.test.mjs
  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-not-a-production-secret
          POSTGRES_DB: retail_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retail_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: retail_qa
      PGUSER: postgres
      PGPASSWORD: qa-only-not-a-production-secret
      PGCONNECT_TIMEOUT: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Build isolated relational fixture with actual Supabase function definitions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/integration/fixture.sql
      - name: Concurrent checkout, request replay, cash movement and shift-close verification
        run: node --test --test-concurrency=1 tests/integration/concurrency.test.mjs
  browser-readability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PC design source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve actual PC source locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/retail-preview-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/retail-preview-server.log
          exit 1
      - name: Read all 60 card labels in real browser, including narrow dark viewport
        run: node tests/browser/pc_card_readability.mjs
      - name: Check fixed PC screens and unchanged 12-card positions
        run: node tests/browser/fixed_pc_screens.mjs
      - name: Check keyboard and outside-click submenu dismissal without moving PC grid
        run: node tests/browser/fixed_pc_submenu_controls.mjs
      - name: Exercise PC cashier, product, receipt, shift and staff forms (in-browser QA only)
        run: node tests/browser/pc_forms_interaction.mjs
      - name: Verify headings, field labels, blank states and tabs stay dark in PC UI
        run: node tests/browser/pc_all_headings_contrast.mjs
      - name: Confirm all 60 redesigned pictograms and stationary cards in Chromium
        run: node tests/browser/pc_icon_visual_polish.mjs
      - name: Check Products-owned multi barcode and carton registration in isolated Chromium
        run: node tests/browser/v14_product_catalog.mjs
  v12-real-auth-rls:
    name: V12 — Real local Supabase Auth / JWT / PostgREST / RLS
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout repository (never a hosted DB)
        uses: actions/checkout@v4
      - name: Node 22 for authenticated E2E assertions
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Supabase local CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Start isolated local GoTrue, PostgREST and PostgreSQL containers
        run: |
          supabase --version
          supabase init --yes
          supabase start
      - name: Apply verified retail contract ONLY to disposable local DB
        env:
          PGPASSWORD: postgres
        run: |
          python3 tests/v12/prepare_local_fixture.py > /tmp/v12-local-functions.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f /tmp/v12-local-functions.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/v12/rls_mirror.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/v14/local_product_registration.sql
      - name: Install pinned Supabase JS client (temporary QA dependency)
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2.118.0
      - name: Real signup, JWT, RBAC, tenant RLS and local-only TRUNCATE regression test
        run: node tests/v12/auth_rls_e2e.mjs
      - name: Stop and remove disposable Supabase stack
        if: always()
        run: supabase stop --no-backup || true
