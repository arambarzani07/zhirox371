<style data-original-filename="ui-fixed-pc.css">
/* Fixed PC screens — owner-requested, design-lock-safe layout behavior.
   The desktop layout remains >=1020px with the same 12 cards / 3x4 grid.
   Only internal content scrolls. Receipt thermal paper printing is unaffected. */
@media screen {
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden !important;
    overscroll-behavior: none;
  }
  body {
    margin: 0 !important;
    padding-top: var(--market-banner-height) !important;
  }

  /* The permanent supermarket banner is already position: fixed. */
  .market-banner {
    position: fixed !important;
    top: 0 !important;
    inset-inline: 0 !important;
    z-index: 10000 !important;
    height: var(--market-banner-height);
    min-height: var(--market-banner-height);
    max-height: var(--market-banner-height);
  }

  /* An outer desktop viewport can pan horizontally on narrow devices,
     but MUST NOT move vertically along with the page. */
  body > .viewport {
    width: 100%;
    height: calc(100vh - var(--market-banner-height));
    height: calc(100dvh - var(--market-banner-height));
    min-height: 0 !important;
    max-height: calc(100dvh - var(--market-banner-height));
    overflow-x: auto !important;
    overflow-y: hidden !important;
    overscroll-behavior: contain;
  }
  body > .viewport > .desktop {
    min-width: 1020px;
    height: 100% !important;
    min-height: 0 !important;
    display: flex;
    flex-direction: column;
    overflow: hidden !important;
  }

  body > .viewport > .desktop > header {
    flex: 0 0 75px;
    height: 75px;
    min-height: 75px;
    width: 100%;
    z-index: 5;
  }
  body > .viewport > .desktop > main {
    flex: 1 1 0%;
    min-height: 0 !important;
    width: 100%;
    margin: 0 auto !important;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior-y: contain;
    overflow-anchor: none;
    scrollbar-gutter: stable;
    scroll-behavior: auto !important;
  }

  /* Subcards appear directly beneath their selected row but float above
     later rows. Opening/closing them never pushes the other 12 cards.
     The original Home's CSS/labels/order remain unchanged. */
  #app { position: relative; }
  #app > .drawer {
    position: absolute !important;
    inset-inline: 0;
    width: 100%;
    margin: 0 !important;
    z-index: 12;
    max-height: min(265px, 52dvh);
    overflow-y: auto;
    overscroll-behavior: contain;
    box-shadow: 0 12px 35px #20395430;
    animation: none !important;
    transition: none !important;
    transform: none !important;
    opacity: 1 !important;
  }
  #app > .row,
  #app > .row > .module {
    animation: none !important;
    transition: none !important;
    transform: none !important;
  }
  #app .module[aria-expanded="true"] .chev {
    transform: none !important;
  }

  /* PC product workspace / cashier / QA and device pages share this
     locked shell without moving the header when long tables grow. */
  body > .viewport > .desktop > main :is(.surface, .page, .card, .panel) {
    scroll-margin-top: 12px;
  }

  /* The separate receipt view has its own fixed viewport and independently
     scrollable print preview; never modify the printable ticket. */
  body > .shell {
    height: calc(100vh - var(--market-banner-height));
    height: calc(100dvh - var(--market-banner-height));
    min-height: 0 !important;
    overflow-x: auto;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-gutter: stable;
  }
}

@media print {
  html, body {
    height: auto !important;
    overflow: visible !important;
    overscroll-behavior: auto !important;
  }
  .market-banner { display: none !important; }
  body { padding-top: 0 !important; }
  body > .shell {
    height: auto !important;

};
const expected=[...main,...sub.flat()];
if(main.length!==12||sub.length!==12||sub.some(row=>row.length!==4)||new Set(expected).size!==60||
 expected.some(id=>!icons[id])||Object.keys(icons).length!==60)throw Error("Home icon catalog incomplete or duplicated");
function svg(id){
 const body=icons[id];if(!body)throw Error("Unknown card icon: "+id);
 return '<svg xmlns="http://www.w3.org/2000/svg" class="retail-pictogram" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'
  +'<circle class="pictogram-halo" cx="19.4" cy="4.6" r="3.2" fill="currentColor" stroke="none" opacity=".13"/>'
  +'<g class="pictogram-lines">'+body+'</g>'
  +'<path class="pictogram-glint" d="M3.4 5.4 5.4 3.4" stroke="currentColor" stroke-width="1.3" opacity=".55"/>'
  +'</svg>';
}
window.RetailCardIcons=Object.freeze({main:Object.freeze(main),sub:Object.freeze(sub.map(row=>Object.freeze(row))),svg});
})();

<script>
(()=>{
"use strict";
const app=document.getElementById("app");
const specs=[
["کاشێر و فرۆشتن","#4c6dcc","#edf2ff","▣",["فرۆشتنی نوێ","پسووڵەکان","پارەدان","گەڕاندنەوە"]],
["کاڵاکان","#15987c","#e7f7f0","⬡",["کاڵای نوێ","لیستی کاڵاکان","نرخەکان","بارکۆدەکان"]],
["کۆگا","#d18b34","#fff2e2","▤",["دۆخی کۆگا","کاڵای کەم","بەسەرچوون","هاتووچۆ"]],
["کڕیاران و حسابەکان","#9565cb","#f2ebfd","◎",["کڕیاران","قەرزەکان","مێژووی کڕین","پارەدانەکان"]],
["کڕین و دابینکەران","#168db7","#e6f5fd","▧",["داواکاری","دابینکەران","وەرگرتنی کاڵا","حسابەکان"]],
["دارایی","#bd7953","#fff1e7","◇",["سندووق","داهات","خەرجی","جووڵەی پارە"]],
["ڕاپۆرت و شیکاری","#5577bc","#edf2fb","▥",["فرۆشتن","قازانج","ڕاپۆرتی کۆگا","شیکاریی زیرەک"]],
["ڕێکخستنەکان","#74849a","#eff2f6","⚙",["بەکارهێنەران","دەسەڵاتەکان","ئامێرەکان","سیستەم"]],
["ئافەر و داشکاندن","#cf6d96","#fcecf2","♧",["ئافەری نوێ","داشکاندن","کوپۆن","کەمپەین"]],
["لیبڵ و چاپکردن","#0f9c9d","#e5f7f7","▦",["لیبڵی نرخ","بارکۆد","چاپی کۆمەڵەیی","قاڵبی چاپ"]],
["شێفت و کارمەندان","#a67d45","#fbf1e3","▤",["شێفتەکان","ئامادەبوون","کاتی کار","هەڵسەنگاندن"]],
["چاودێری و مۆڵەتەکان","#745dc5","#eeeafd","♢",["ئاگادارییەکان","داوای مۆڵەت","گۆڕانکارییەکان","پشکنینی مامەڵە"]]
];
const cardIcons=window.RetailCardIcons;
const state={open:-1,page:null,products:[],cart:[],msg:""};
const money=n=>n.toLocaleString("en-US")+" IQD";
/* Contrast-critical labels: bind opaque dark ink to the text node itself.
   Inline important declarations outrank theme styles, including iOS Safari overrides. */
function makeReadableLabel(node){
 for(const [key,value] of [
   ["color","#172b45"],
   ["-webkit-text-fill-color","#172b45"],
   ["opacity","1"],
   ["font-weight","900"],
   ["text-shadow","none"],
   ["visibility","visible"]
 ])node.style.setProperty(key,value,"important");
 node.dataset.contrastLabel="true";
 return node;
}

function focusModule(index){
 if(index<0)return;
 const button=app.querySelector('[data-module="'+index+'"]');
 if(button)button.focus({preventScroll:true});
}
function closeSubmenu(restoreFocus=true){
 const previouslyOpen=state.open;
 if(previouslyOpen<0)return;
 state.open=-1;
 draw();
 if(restoreFocus)focusModule(previouslyOpen);
}
function back(){state.page=null;state.msg="";draw()}
function draw(){
 if(state.page){drawPage();return}
 app.replaceChildren();
 const h=document.createElement("h1");h.textContent="بەشە سەرەکییەکان";app.append(h);
 for(let r=0;r<3;r++){
  const row=document.createElement("div");row.className="row";
  for(let c=0;c<4;c++){
   const i=r*4+c,s=specs[i];
   const b=document.createElement("button");b.type="button";b.className="module";b.dataset.module=i;b.setAttribute("aria-expanded",String(i===state.open));if(i===state.open)b.setAttribute("aria-controls","market-card-submenu");
   b.style.setProperty("--color",s[1]);b.style.setProperty("--light",s[2]);
   b.innerHTML='<span class="icon"></span><span class="end"><span class="name"></span><span class="chev">⌄</span></span>';
   b.querySelector(".icon").innerHTML=cardIcons.svg(cardIcons.main[i]);const mainLabel=makeReadableLabel(b.querySelector(".name"));mainLabel.textContent=s[0];row.append(b);
  }
  app.append(row);
  if(Math.floor(state.open/4)===r&&state.open>=0){
   const s=specs[state.open],drawer=document.createElement("div");drawer.className="drawer";drawer.id="market-card-submenu";drawer.setAttribute("role","region");drawer.setAttribute("aria-label",s[0]);
   drawer.innerHTML='<div class="drawerhead"><strong></strong><button class="close" data-close aria-label="داخستن">✕</button></div><div class="subgrid"></div>';
   makeReadableLabel(drawer.querySelector(".drawerhead strong")).textContent=s[0];
   s[4].forEach((label,j)=>{const b=document.createElement("button");b.className="sub";b.dataset.sub=j;b.style.setProperty("--color",s[1]);b.style.setProperty("--light",s[2]);b.innerHTML='<span class="sub-icon"></span><span class="sub-footer"><span class="sub-name"></span><span class="sub-arrow">↖</span></span>';b.querySelector(".sub-icon").innerHTML=cardIcons.svg(cardIcons.sub[state.open][j]);makeReadableLabel(b.querySelector(".sub-name")).textContent=label;drawer.querySelector(".subgrid").append(b)});
   app.append(drawer);
  }
 }
}
function layout(title){
 app.innerHTML='<section class="page"><div class="pagehead"><button class="back" data-back aria-label="گەڕانەوە">→</button><h2></h2></div><div id="body"></div></section>';
 app.querySelector("h2").textContent=title;return app.querySelector("#body");
}
function drawPage(){
 const title=state.page.label,b=layout(title);
 if(state.page.module===1){
  if(title==="کاڵای نوێ"){
   b.innerHTML='<form id="add" class="inputs"><label class="field">ناوی کاڵا<input name="name" required maxlength="160"></label><label class="field">بارکۆد<input name="code" required maxlength="60"></label><label class="field">نرخ (IQD)<input name="price" type="number" min="0" step="1" required></label><button class="primary">زیادکردن</button></form><div class="feedback" id="feedback"></div>';
   b.querySelector("#feedback").textContent=state.msg;
  }else if(title==="لیستی کاڵاکان"&&state.products.length){
   const t=document.createElement("table");t.innerHTML='<thead><tr><th>کاڵا</th><th>بارکۆد</th><th>نرخ</th></tr></thead><tbody></tbody>';
   state.products.forEach(p=>{const tr=document.createElement("tr");for(const v of [p.name,p.code,money(p.price)]){const td=document.createElement("td");td.textContent=v;tr.append(td)}t.tBodies[0].append(tr)});b.append(t);
  }else b.innerHTML='<div class="empty">هیچ کاڵایەک نییە</div>';
  return;
 }
 if(state.page.module===0&&title==="فرۆشتنی نوێ"){
  b.innerHTML='<div class="pos"><div class="panel"><form class="inputs" id="scan"><label class="field">بارکۆد<input name="code" required autocomplete="off"></label><button class="primary">زیادکردن</button></form><div class="feedback" id="feedback"></div><div id="lines"></div></div><div class="panel"><strong>پسووڵە</strong><div class="total"><span>کۆی گشتی</span><strong id="total"></strong></div><p><button class="plain" data-clear>پاککردنەوە</button></p></div></div>';
  b.querySelector("#feedback").textContent=state.msg;b.querySelector("#total").textContent=money(state.cart.reduce((n,x)=>n+x.price*x.qty,0));
  const area=b.querySelector("#lines");
  if(!state.cart.length)area.innerHTML='<div class="empty">سەبەتە بەتاڵە</div>';
  else{const table=document.createElement("table");table.innerHTML='<thead><tr><th>کاڵا</th><th>نرخ</th><th>بڕ</th><th>کۆ</th></tr></thead><tbody></tbody>';
    state.cart.forEach((x,i)=>{const tr=document.createElement("tr");for(const val of [x.name,money(x.price),"",money(x.qty*x.price)]){const td=document.createElement("td");td.textContent=val;tr.append(td)}tr.children[2].innerHTML='<button class="qty" data-qty="'+i+'" data-delta="-1">−</button> '+x.qty+' <button class="qty" data-qty="'+i+'" data-delta="1">+</button>';table.tBodies[0].append(tr)});
    area.append(table)}return;
 }
 b.innerHTML='<div class="empty">هێشتا ئامادە نییە</div>';
}
app.addEventListener("click",e=>{
 const mod=e.target.closest("[data-module]");if(mod){const i=Number(mod.dataset.module);state.open=state.open===i?-1:i;draw();focusModule(i);return}
 if(e.target.closest("[data-close]")){closeSubmenu();return}
 const sub=e.target.closest("[data-sub]");if(sub){const tab=Number(sub.dataset.sub);if(state.open===1&&(tab===0||tab===1)){window.location.assign("./workspace.html?view="+(tab===0?"new":"list"));return;}if(state.open===11&&tab===3){window.location.assign("./qa.html");return;}if((state.open===7&&tab===2)||(state.open===9&&tab===3)){window.location.assign("./diagnostics.html");return;}if((state.open===0&&(tab===0||tab===1))||(state.open===2&&tab===0)||(state.open===5&&tab===0)||(state.open===10&&tab===0)||(state.open===7&&tab===0)||(state.open===11&&tab===2)){const mode=state.open===0?(tab===1?"receipts":"cash"):state.open===2?"stock":(state.open===5||state.open===10)?"shift":state.open===7?"staff":"audit";window.location.assign("./operations.html?view="+mode);return;}state.page={module:state.open,label:specs[state.open][4][tab]};state.msg="";draw();return}
 if(!state.page&&state.open>=0&&e.target.closest(".drawer")&&!e.target.closest("[data-sub]")){closeSubmenu();return}
 if(!state.page&&state.open>=0&&!e.target.closest(".drawer")&&!e.target.closest("[data-module]")){closeSubmenu();return}
 if(e.target.closest("[data-back]")){back();return}
 if(e.target.closest("[data-clear]")){state.cart=[];draw();return}
 const q=e.target.closest("[data-qty]");if(q){const i=Number(q.dataset.qty);state.cart[i].qty+=Number(q.dataset.delta);if(!state.cart[i].qty)state.cart.splice(i,1);draw()}
});
app.addEventListener("submit",e=>{
 if(e.target.id==="add"){e.preventDefault();const f=new FormData(e.target),name=String(f.get("name")||"").trim(),code=String(f.get("code")||"").trim(),price=Number(f.get("price"));
 if(!name||!code||!Number.isSafeInteger(price)||price<0){state.msg="زانیاری نادروستە";draw();return}
 if(state.products.some(x=>x.code===code)){state.msg="بارکۆد دووبارەیە";draw();return}
 state.products.push({name,code,price});state.msg="زیادکرا";draw();}
 if(e.target.id==="scan"){e.preventDefault();const code=String(new FormData(e.target).get("code")||"").trim(),p=state.products.find(x=>x.code===code);
 if(!p){state.msg="بارکۆدەکە نەدۆزرایەوە";draw();return}
 const x=state.cart.find(x=>x.code===code);if(x)x.qty++;else state.cart.push({...p,qty:1});state.msg="";draw();}
});
document.getElementById("home").addEventListener("click",()=>{state.open=-1;back()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(state.page)back();else if(state.open>=0){e.preventDefault();closeSubmenu();}}});
document.addEventListener("pointerdown",e=>{if(state.open<0||state.page||app.contains(e.target)||e.target.closest("#home"))return;closeSubmenu(false);});
draw();
})();
</script></body></html>
