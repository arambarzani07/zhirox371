<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ناوەندی پشکنینی مامەڵەکان</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#213149;font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #99b5e5;outline-offset:2px}
.viewport{overflow-x:auto;min-height:100vh}.desktop{min-width:1020px;min-height:100vh;direction:rtl}
header{height:75px;background:#fff;border-bottom:1px solid #e7ecf2;padding:0 42px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:13px;align-items:center;font-weight:800;color:#27394f;text-decoration:none;font-size:19px}.mark{height:43px;width:43px;background:#243d60;color:#fff;border-radius:12px;display:grid;place-items:center;font-size:25px}
.home{border:1px solid #e5eaf0;color:#556a84;background:#f7f9fc;border-radius:10px;width:38px;height:38px;display:grid;place-items:center;text-decoration:none;font-size:20px}
main{padding:38px 44px 58px;max-width:1440px;margin:auto}h1{font-size:23px;font-weight:850;margin:0 0 24px}h2{font-size:18px;margin:0;font-weight:800}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:17px}
.metric{padding:21px;background:#fff;border:1px solid #e5eaf0;border-radius:15px;min-height:107px;display:flex;justify-content:space-between;flex-direction:column}
.metric strong{font-size:23px;color:#274971;direction:ltr;text-align:right}.metric span{font-size:12px;color:#75869a}
.surface{background:#fff;border:1px solid #e5eaf0;border-radius:16px;padding:23px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.link{color:#42658b;text-decoration:none;border:1px solid #dde6f1;border-radius:9px;padding:10px 14px;font-size:13px;background:#f8fafc;font-weight:700}
.filters{display:flex;gap:9px;margin-bottom:18px}
.filters button{border:1px solid #e1e7ef;color:#64758d;background:#f7f9fc;border-radius:9px;padding:10px 18px;font-size:13px;font-weight:750}
.filters button.active{background:#284973;border-color:#284973;color:#fff}
.layout{display:grid;grid-template-columns:1.2fr .9fr;gap:16px}
.testlist{display:flex;flex-direction:column;gap:9px}
.test{border:1px solid #e6ebf1;border-radius:10px;background:#fbfcfe;min-height:61px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:right;color:#2a3c54;font-size:13px;font-weight:750}
.test.active{border-color:#88a7ce;background:#f2f6fc}
.test .number{height:30px;width:30px;border-radius:8px;background:#eaf1fa;color:#506e92;display:grid;place-items:center;font-size:12px;direction:ltr;flex:none}
.test .name{flex:1}
.detail{padding:22px;background:#f8fafd;border:1px solid #e5ebf2;border-radius:12px;min-height:290px}
.detail h3{font-size:17px;margin:0 0 16px}
.detail p{font-size:13px;color:#657991;line-height:2}
.detail .line{height:1px;background:#e6eaf0;margin:18px 0}
.detail .tag{font-size:12px;color:#8a6731;background:#fff6e5;padding:6px 9px;border-radius:7px;display:inline-block}
.detail .tip{font-size:12px;color:#74859b;line-height:2}
.notice{margin-top:18px;color:#7a8b9e;font-size:12px;line-height:2}
</style>
<link rel="stylesheet" href="./ui-global.css">
<link rel="stylesheet" href="./ui-fixed-pc.css">
</head>
<body>
<div class="market-banner">سوپەرمارکێتی کانی چنار</div><div class="viewport"><div class="desktop">
<header><a class="brand" href="./index.html"><span class="mark">◈</span><span>سیستەمی کاشێر</span></a><a class="home" href="./index.html" aria-label="سەرەتا">⌂</a></header>
<main>
<h1>پشکنینی مامەڵەکان</h1>
<div class="row">
<div class="metric"><span>دۆخی پڕۆژە</span><strong style="font-size:17px">QA / V8</strong></div>
<div class="metric"><span>تاقیکردنەوە</span><strong>10</strong><span>هاوکات</span></div>
<div class="metric"><span>داتابەیس</span><strong style="font-size:17px">PostgreSQL 16</strong></div>
</div>
<section class="surface">
<div class="head"><h2>تاقیکردنەوەکان</h2><a class="link" href="https://github.com/arambarzani07/zhirox371/actions/workflows/pc-foundation.yml" target="_blank" rel="noopener noreferrer">ئەنجامی تاقیکردنەوە</a></div>
<div class="filters"><button type="button" data-filter="all" class="active">هەمووی</button><button type="button" data-filter="sale">فرۆشتن</button><button type="button" data-filter="shift">شێفت و سندووق</button><button type="button" data-filter="auth">دەسەڵات</button></div>
<div class="layout">
<div class="testlist" id="cases"></div>
<div class="detail"><h3 id="case-title"></h3><span class="tag">تاقیگەی جیاواز</span><div class="line"></div><p id="case-description"></p><p class="tip" id="case-expected"></p></div>
</div>
<p class="notice">ئەم پەڕەیە داتابەیس ناگۆڕێت. ئەنجامی ڕاستەقینە لە GitHub Actions ببینە.</p>
</section>
</main></div></div>
<script>
(()=>{
"use strict";
const root=document.getElementById("cases"), title=document.getElementById("case-title"),
description=document.getElementById("case-description"),expected=document.getElementById("case-expected");
const items=[
["فرۆشتنی کۆتا دانە بە دوو کاشێر","sale","دوو کاشێر هەمان دانە دەفرۆشن.","تەنها یەک فرۆشتن سەرکەوتوو دەبێت؛ کۆگا نابێت منفی بێت."],
["دووبارە ناردنی هەمان مامەڵە","sale","هەمان request ID لە دوو پەیوەندیی هاوکات دەنێردرێت.","یەک پسووڵە و یەک جووڵەی کۆگا."],
["گۆڕینی پارە بە request ID ـی کۆن","sale","بڕی پارەی داواکاریی تۆمارکراو دەگۆڕدرێت.","دەبێت ڕەت بکرێتەوە."],
["داواکاریی کاشێری جیاواز","auth","کاشێری دووەم هەمان request ID ـی کاشێری یەکەم بەکار دەهێنێت.","پێویستە ڕەت بکرێتەوە."],
["فرۆشتن هاوکات لەگەڵ داخستنی شێفت","shift","فرۆشتن و داخستنی شێفت هاوکات دەبن.","ڕاپۆرتی شێفت دەبێت لەگەڵ کۆی پسووڵەکان یەک بگرێتەوە."],
["دووبارەناردنی پارەی سندووق","shift","هەمان cash movement ID هاوکات دوو جار نێردراوە.","تەنها یەک جووڵەی پارە تۆمار دەبێت."],
["فرۆشتن بێ شێفت","shift","کاشێر بێ شێفتی کراوە داوای فرۆشتن دەکات.","هیچ فرۆشتن و کەمکردنەوەی کۆگا تۆمار ناکرێت."],
["بەکارهێنەری بێ مۆڵەت","auth","هەژمارێکی بێ مۆڵەتی کاشێر داوای فرۆشتن دەکات.","دەبێت ڕەت بکرێتەوە."],
["دووبارە پشکنینەوە دوای داخستنی شێفت","shift","هەمان داواکاری دوای داخستنی شێفت دەنێردرێتەوە.","هەمان پسووڵە دەگەڕێتەوە، بێ فرۆشتنی نوێ."],
["١٢ داواکاری هاوکات بۆ سێ دانە","sale","١٢ داواکاری بۆ سێ دانە هاوکات دەبن.","تەنها سێ فرۆشتن سەرکەوتوو دەبێت و ژمارەی پسووڵەکان 1، 2، 3 دەبن."]
];
let filter="all",selected=0;
function draw(){
 root.replaceChildren();
 items.forEach((x,i)=>{if(filter!=="all"&&x[1]!==filter)return;
  const b=document.createElement("button");b.type="button";b.className="test"+(i===selected?" active":"");
  const number=document.createElement("span");number.className="number";number.textContent=String(i+1).padStart(2,"0");
  const name=document.createElement("span");name.className="name";name.textContent=x[0];
  const arrow=document.createElement("span");arrow.textContent="↖";b.append(number,name,arrow);
  b.addEventListener("click",()=>{selected=i;draw()});root.append(b);
 });
 const row=items[selected];title.textContent=row[0];description.textContent=row[2];expected.textContent="ئەنجام: "+row[3];
}
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{
 filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(y=>y.classList.toggle("active",y===b));
 if(filter!=="all"&&items[selected][1]!==filter)selected=items.findIndex(x=>x[1]===filter);
 draw();
}));
draw();
})();
</script>
</body></html>
