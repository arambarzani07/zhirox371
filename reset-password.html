<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>گەڕاندنەوەی وشەی نهێنی — سوپەرمارکێتی کانی چنار</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:#f3f6fa;color:#172b45;font-family:system-ui,Segoe UI,Tahoma,sans-serif;display:grid;place-items:center}
main{width:min(100%,540px);padding:26px;border:1px solid #d9e1eb;border-radius:16px;background:white}
h1{font-size:22px;margin:0 0 18px}
label{display:block;font-weight:800;margin:15px 0}
input{width:100%;display:block;border:1px solid #adbed1;border-radius:9px;margin-top:8px;padding:12px;height:49px;font:inherit;direction:ltr}
button{border:0;background:#254365;color:white;border-radius:9px;padding:13px 17px;font:inherit;font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
a{color:#254365;font-weight:700}#status{min-height:32px;line-height:1.9;font-weight:700}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script src="./config.js"></script>
</head>
<body><main>
<h1>گۆڕینی وشەی نهێنی</h1>
<p>تەنها بەستەری گەڕاندنەوەی ئیمەیڵی هەژماری خۆت بەکاربهێنە. وشەی نهێنیت بۆ هیچ کەسێک مەنووسە.</p>
<form id="password-form" hidden>
<label>وشەی نهێنی نوێ
<input id="password" type="password" autocomplete="new-password" minlength="12" required></label>
<label>دووبارە وشەی نهێنی
<input id="password-confirm" type="password" autocomplete="new-password" minlength="12" required></label>
<button id="save" type="submit">پاشەکەوتکردنی وشەی نهێنی</button>
</form>
<p id="status" role="status">بەستەری گەڕاندنەوە پشتڕاست دەکرێتەوە...</p>
<a href="./operations.html">گەڕانەوە بۆ چوونەژوورەوە</a>
</main>
<script>
'use strict';
(async()=>{
 const $=id=>document.getElementById(id);
 const form=$('password-form'),message=$('status');
 const config=window.RETAIL_CONFIG;
 const url=new URL(location.href);
 // Recovery links include #type=recovery in implicit flow or ?code= in PKCE.
 // Do not let an already authenticated user treat an ordinary page visit as recovery.
 const wasRecoveryLink=url.hash.includes('type=recovery') ||
   url.searchParams.get('type')==='recovery' || url.searchParams.has('code');
 if(!wasRecoveryLink){
  message.textContent='بەستەری گەڕاندنەوە لە ئیمەیڵەکەت بکەرەوە؛ ئەم پەڕەیە بە تەنها مۆڵەتی گۆڕینی وشەی نهێنی نادات.';
  return;
 }
 if(!window.supabase?.createClient||!config?.supabaseUrl||!config?.publishableKey){
  message.textContent='پەیوەندی Supabase بەردەست نییە.';
  return;
 }
 const client=window.supabase.createClient(config.supabaseUrl,config.publishableKey,{
  auth:{storageKey:'zhirox-one-time-recovery',persistSession:false,
    autoRefreshToken:false,detectSessionInUrl:true}
 });
 let recoveryReady=false;
 function enable(session){
  if(!session||recoveryReady)return;
  recoveryReady=true;
  form.hidden=false;
  message.textContent='بەستەرەکە پشتڕاست کرایەوە؛ وشەی نهێنی نوێ دابنێ.';
  // Avoid lingering sensitive fragments after JS has consumed recovery tokens.
  history.replaceState(null,'',url.pathname);
 }
 client.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'&&session)enable(session);
 });
 try{
  // The v2 SDK exchanges PKCE codes in detectSessionInUrl, and processes
  // implicit #access_token links before resolving getSession().
  const {data,error}=await client.auth.getSession();
  if(error)throw error;
  if(data.session)enable(data.session);
  else message.textContent='بەستەرەکە بەسەرچووە یان نادروستە؛ دووبارە داوای گەڕاندنەوە بکە.';
 }catch{
  message.textContent='پشتڕاستکردنەوەی بەستەر شکستی هێنا؛ دووبارە داوا بکە.';
 }
 form.addEventListener('submit',async event=>{
  event.preventDefault();
  if(!recoveryReady)return;
  const pass=$('password').value,confirm=$('password-confirm').value;
  if(pass.length<12||pass!==confirm){
   message.textContent='وشەی نهێنی دەبێت لانیکەم 12 پیت بێت و هەردوو یەکسان بن.';
   return;
  }
  $('save').disabled=true;
  try{
   const {error}=await client.auth.updateUser({password:pass});
   if(error)throw error;
   await client.auth.signOut();
   form.hidden=true;
   $('password').value='';
   $('password-confirm').value='';
   message.textContent='وشەی نهێنی نوێ پاشەکەوت کرا. ئێستا بچۆ ژوورەوە.';
  }catch{
   message.textContent='پاشەکەوتکردنی وشەی نهێنی شکستی هێنا؛ بەستەرەکە بپشکنە.';
   $('save').disabled=false;
  }
 });
})();
</script></body></html>
